name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Force Exact Gradle Version
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.1.1'

      - name: Setup Android Project Files
        run: |
          echo "include ':app'" > settings.gradle
          
          # Nayi file: AndroidX mode ON karne ke liye
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          EOF
          
          cat << 'EOF' > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.1.1' }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF
          
          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.ceo.quizapp'
              compileSdk 34
              defaultConfig { applicationId "com.ceo.quizapp"; minSdk 24; targetSdk 34; versionCode 1; versionName "1.0" }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.gms:play-services-ads:23.0.0'
          }
          EOF
          
          mkdir -p app/src/main/res/values
          cat << 'EOF' > app/src/main/res/values/themes.xml
          <resources><style name="Theme.AppCompat.Light.NoActionBar" parent="Theme.AppCompat.Light"><item name="windowActionBar">false</item><item name="windowNoTitle">true</item></style></resources>
          EOF
          
          sed -i 's/android:icon="@mipmap\/ic_launcher"//g' app/src/main/AndroidManifest.xml
          sed -i 's/android:roundIcon="@mipmap\/ic_launcher_round"//g' app/src/main/AndroidManifest.xml
          
          sed -i "s/YAHAN_APNI_API_KEY_DAAL/${{ secrets.GEMINI_API_KEY }}/g" app/src/main/java/com/ceo/quizapp/QuizActivity.java

      - name: Compile APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK Download Link
        uses: actions/upload-artifact@v4
        with:
          name: FX-Quiz-App
          path: app/build/outputs/apk/debug/app-debug.apk
